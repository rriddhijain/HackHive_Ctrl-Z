# Runtime configuration. Contract: SPEC.md §10. Camera sources: int = webcam index, path = video file, URL = http/rtsp stream.
cameras:
  - { id: cam1, name: "Front Desk (webcam)", source: 0 }
  - { id: cam2, name: "Lobby (recorded)", source: "data/demo/sample_bus.mp4" }
  # Live fall camera (D47): iPhone 15 via Continuity (USB), mounted ~2 m high and angled down so the floor is in view.
  # Add door_zone only if a door is in its view (tailgating needs it, E-7). Index from scripts/list_cameras.py.
  # - { id: cam3, name: "Floor & Door (iPhone)", source: 1, door_zone: [[0.42,0.20],[0.58,0.20],[0.58,0.95],[0.42,0.95]] }
  # - { id: cam4, name: "Corridor (Pixel)", source: "http://192.168.43.20:8080/video" }

detector:
  model: models/yolo26n.pt       # nano on CPU: leaves the GPU to the VLM (D34)
  fps: 10
  imgsz: 480                     # 480 vs 640 on CPU, 3 cams: 36 vs 58 ms/frame, same detections on test clip (D36)
  conf: 0.35
  device: cpu                    # mps + VLM: YOLO 119 ms/frame, keep-up 79 %, VLM spikes; cpu: 70 ms, 99 %, VLM unaffected
  classes: [0, 24, 26, 28, 43]   # person, backpack, handbag, suitcase, knife (COCO)
  buffer_s: 4.0
  frame_width: 640               # frames are resized to this width for the buffer, gates and mosaics

vlm:
  base_url: "http://localhost:11434"
  endpoint: "/api/chat"
  model: "qwen3.5:4b-mlx"
  confidence_source: logprobs    # or "model_field" (fallback, SPEC E-1a)
  stream: true
  temperature: 0
  logprobs: true
  top_logprobs: 10
  max_tokens: 80
  mosaic_frames: 4
  mosaic_span_s: 2.0
  tile: [288, 160]               # 16:9 tiles, each frame letterboxed (fit + grey pad, never stretched) -> 576x320 grid (D44)
  baseline_interval_s: 3
  empty_interval_s: 10
  baseline_skip: { mad: 6, max_skip_s: 15 }   # skip a baseline if the scene hasn't changed since this camera's last call (D42)
  duty_target: 0.55              # baselines back off (one per camera per 15 s) while GPU duty > this; P1s never throttled (D66)
  summary_every_n: 3             # confident-normal baselines stop at the category; every Nth writes a summary (D42)
  p1_crop: { enabled: false, max_box_frac: 0.4, expand: 1.75 }   # FR-9c, final, on only if the dev A/B wins (D45)
  trigger_max_age_s: 4
  timeout_s: 6
  relook: { c_low: 0.40, c_high: 0.70, margin: 0.20 }
  think: false
  keep_alive: -1
  num_ctx: 4096                  # fixed on EVERY call (vision + chat): a changing num_ctx makes Ollama reload the model (D38)
  parallel_slots: 1

gate:
  crowd_min: 8
  crowd_rise: 5
  tailgate_window_s: 2.5
  loiter_s: 30
  down_ratio: 1.2
  down_hold_s: 0.5               # D34
  drop_frac: 0.4
  drop_window_s: 0.5
  horizontal_recheck_s: 30       # after a confident-normal verdict, a still-horizontal track re-triggers only after this (D61)
  fast_drop_max_narrow: 0.20     # fast drop ignored if the box got >20 % narrower (occlusion/walking away, D61); 1.0 = guard off
  fight_speed: 0.5               # body heights per second; 1.0 missed 3 of 6 dev fights (D64); 0.6 fired 2.0 s after a shove's onset (D80)
  fight_min_height_ratio: 0.5    # the pair's boxes within 2x height (same depth): people far apart overlap only in the picture (D72)
  fight_contact_s: 0.5           # the pair overlapped within this; a shove's fast part comes after the boxes part (D72)
  min_track_age_s: 0.5
  scene_change_frac: 0.25

events:
  open_single_critical: 0.70
  open_single_other: 0.85
  open_window: 0.55
  dismiss_hold_s: 60             # after "Mark false alarm", that camera + category opens no new event (FR-25)
  open_window_ungated: 0.50   # crowd, property damage, suspicious: no gate can corroborate them (D77)
  window_n: 3
  close_c: 0.40
  close_after_s: 8
  close_after_obs: 2             # AND this many consecutive non-supporting observations of the camera (D43)
  corroborate_boost: 1.15
  contradict_factor: 0.5        # E-7 detector veto; person counts = max over the 4 s buffer (D46)
  calibration_T: 1.0
  rating: { high: 0.80, medium: 0.60 }

classifier: { enabled: false, encoder: siglip2-base, fusion_w: 0.5 }   # FR-9b, built only if dev macro F1 < 0.70 (D48)
detector_pose_ab: { model: models/yolo26n-pose.pt }                 # FR-6a, P2 comparison only

replay:
  store_events_on_replay: true
  reset_live_tables_on_start: true

chat:
  llm: true                 # D75: the model reads every question and writes the answer; false = chat v1 (rules + templates)
  base_url: "same-as-vlm"
  model: "same-as-vlm"
